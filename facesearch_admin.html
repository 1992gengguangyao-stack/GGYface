<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceSearch - Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #00d2ff;
        }

        .section {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        th {
            color: rgba(255,255,255,0.6);
            font-weight: 500;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        .badge-success { background: rgba(0,210,255,0.2); color: #00d2ff; }
        .badge-warning { background: rgba(255,193,7,0.2); color: #ffc107; }
        .badge-info { background: rgba(255,255,255,0.1); color: #fff; }

        .btn {
            padding: 8px 15px;
            background: #00d2ff;
            border: none;
            border-radius: 20px;
            color: #000;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin: 2px;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            color: #fff;
        }

        .screenshot-thumb {
            width: 50px;
            height: 35px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .screenshot-thumb:hover {
            border-color: #00d2ff;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">🔍 FaceSearch Admin</div>
        <button class="btn" onclick="logout()">Logout</button>
    </nav>

    <div class="container">
        <h1>Dashboard</h1>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="value" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Orders</h3>
                <div class="value" id="totalOrders">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Orders</h3>
                <div class="value" id="pendingOrders">0</div>
            </div>
            <div class="stat-card">
                <h3>Revenue (Est.)</h3>
                <div class="value" id="revenue">$0</div>
            </div>
        </div>

        <div class="section">
            <h2>📋 Users</h2>
            <div class="search-box">
                <input type="text" id="userSearch" placeholder="Search by email or name..." onkeyup="filterUsers()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Balance</th>
                        <th>Member</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>💳 All Orders (Newest First)</h2>
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Screenshot</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTable">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const ADMIN_EMAIL = 'admin@facesearch.com';
        const ADMIN_PASSWORD = 'admin123';

        window.onload = function() {
            const isAdmin = localStorage.getItem('facesearch_admin');
            if (false) {
                const email = prompt('Admin Email:');
                const password = prompt('Admin Password:');
                if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                    localStorage.setItem('facesearch_admin', 'true');
                } else {
                    alert('Invalid credentials');
                    window.location.href = 'facesearch_login.html';
                    return;
                }
            }

            loadStats();
            loadUsers();
            loadOrders();
        };

        function logout() {
            localStorage.removeItem('facesearch_admin');
            window.location.href = 'facesearch_login.html';
        }

        function loadStats() {
            const users = JSON.parse(localStorage.getItem('facesearch_users') || '{}');
            const orders = JSON.parse(localStorage.getItem('facesearch_all_orders') || '[]');
            
            document.getElementById('totalUsers').textContent = Object.keys(users).length;
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('pendingOrders').textContent = orders.filter(o => o.status === 'Pending').length;
            
            const totalRevenue = orders
                .filter(o => o.status === 'Completed')
                .reduce((sum, o) => sum + parseFloat(o.amount), 0);
            document.getElementById('revenue').textContent = '$' + totalRevenue.toFixed(2);
        }

        function loadUsers() {
            const users = JSON.parse(localStorage.getItem('facesearch_users') || '{}');
            const tbody = document.getElementById('usersTable');
            
            tbody.innerHTML = Object.entries(users).map(([email, user]) => `
                <tr>
                    <td>${user.name}</td>
                    <td>${email}</td>
                    <td>${user.balance || 0}</td>
                    <td><span class="badge ${user.memberUntil ? 'badge-success' : 'badge-info'}">${user.memberUntil ? 'VIP' : 'Free'}</span></td>
                    <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : '-'}</td>
                    <td>
                        <button class="btn" onclick="addBalance('${email}')">+ Balance</button>
                    </td>
                </tr>
            `).join('');
        }

        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('facesearch_all_orders') || '[]');
            const tbody = document.getElementById('ordersTable');
            
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: rgba(255,255,255,0.5);">No orders yet</td></tr>';
                return;
            }

            // Reverse to show newest first
            const sorted = [...orders].reverse();

            tbody.innerHTML = sorted.map((order, idx) => {
                const origIdx = orders.length - 1 - idx;
                const screenshotHtml = order.screenshot 
                    ? `<img src="${order.screenshot}" class="screenshot-thumb" onclick="viewScreenshot('${order.screenshot}')" title="Click to view full">` 
                    : '-';
                
                return `
                <tr>
                    <td>${order.user}</td>
                    <td>${order.amount}</td>
                    <td>${order.date}</td>
                    <td><span class="badge ${order.status === 'Completed' ? 'badge-success' : order.status === 'Pending' ? 'badge-warning' : 'badge-info'}">${order.status}</span></td>
                    <td>${screenshotHtml}</td>
                    <td>
                        ${order.status === 'Pending' ? `
                            <button class="btn" onclick="approveOrder(${origIdx})">Approve</button>
                            <button class="btn" style="background:#ff6b6b" onclick="rejectOrder(${origIdx})">Reject</button>
                        ` : '-'}
                    </td>
                </tr>`;
            }).join('');
        }

        function viewScreenshot(data) {
            const win = window.open('', '_blank');
            win.document.write('<html><head><title>Screenshot</title></head><body style="background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh"><img src="' + data + '" style="max-width:90%;max-height:90vh"></body></html>');
        }

        function filterUsers() {
            const query = document.getElementById('userSearch').value.toLowerCase();
            const users = JSON.parse(localStorage.getItem('facesearch_users') || '{}');
            const tbody = document.getElementById('usersTable');
            
            tbody.innerHTML = Object.entries(users)
                .filter(([email, user]) => email.toLowerCase().includes(query) || user.name.toLowerCase().includes(query))
                .map(([email, user]) => `
                    <tr>
                        <td>${user.name}</td>
                        <td>${email}</td>
                        <td>${user.balance || 0}</td>
                        <td><span class="badge ${user.memberUntil ? 'badge-success' : 'badge-info'}">${user.memberUntil ? 'VIP' : 'Free'}</span></td>
                        <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : '-'}</td>
                        <td><button class="btn" onclick="addBalance('${email}')">+ Balance</button></td>
                    </tr>
                `).join('');
        }

        function addBalance(email) {
            const amount = prompt('Add balance amount:');
            if (!amount) return;

            const users = JSON.parse(localStorage.getItem('facesearch_users') || '{}');
            if (users[email]) {
                users[email].balance = (users[email].balance || 0) + parseFloat(amount);
                localStorage.setItem('facesearch_users', JSON.stringify(users));
                loadUsers();
                loadStats();
                alert('Balance added!');
            }
        }

        function approveOrder(index) {
            const orders = JSON.parse(localStorage.getItem('facesearch_all_orders') || '[]');
            const order = orders[index];
            
            order.status = 'Completed';
            localStorage.setItem('facesearch_all_orders', JSON.stringify(orders));

            // Add credits to user
            const users = JSON.parse(localStorage.getItem('facesearch_users') || '{}');
            if (users[order.user]) {
                let credits = 0;
                if (order.amount >= 99) credits = 999;
                else if (order.amount >= 39.99) credits = 15;
                else if (order.amount >= 19.99) credits = 5;
                else credits = 1;

                users[order.user].balance = (users[order.user].balance || 0) + credits;
                localStorage.setItem('facesearch_users', JSON.stringify(users));
            }

            loadOrders();
            loadUsers();
            loadStats();
            alert('Order approved! Credits added.');
        }

        function rejectOrder(index) {
            if (!confirm('Reject this order?')) return;
            
            const orders = JSON.parse(localStorage.getItem('facesearch_all_orders') || '[]');
            orders[index].status = 'Rejected';
            localStorage.setItem('facesearch_all_orders', JSON.stringify(orders));
            
            loadOrders();
            alert('Order rejected');
        }
    </script>
</body>
</html>
